# Build and deploy the site. README.md is the only source of truth: index.html,
# the growth figure and the badge's stats.json are built here and never committed,
# so PRs (including the weekly scout's) touch README.md alone and cannot collide
# on derived files.
#
#   pull_request  lint + test + build; the built site is attached as an artifact and
#                 summarised on the run page (no PR comments, so fork PRs pass too)
#   push to main  same, then deploy to GitHub Pages
#   weekly        rebuild + deploy so the OpenAlex panel of the figure stays current
name: Site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Mondays, after the Paper Scout
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # "Last updated" is the README's last commit date

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # xkcd-style font for the figure; cosmetic, so never let it block a deploy.
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-humor-sans) \
            || echo "::warning::fonts-humor-sans not installed; the figure will use a fallback font."
          pip install -r requirements.txt

      - name: Lint README tables
        run: python scripts/lint_readme.py --strict

      - name: Test
        run: pytest tests -q

      - name: Build site
        run: |
          python scripts/website_generator.py --out _site
          python scripts/plot_paper_growth.py --out _site/assets/paper_growth.png

      - name: Summarise
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("_site/stats.json"))["stats"]
          print("### Site build\n")
          print(f"**{s['total_papers']}** papers · **{s['years_span']}** years · "
                f"**{s['with_code']}** with code · **{s['with_data']}** with data\n")
          print("Preview: download the `site` artifact below and open `index.html`.")
          PY

      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
