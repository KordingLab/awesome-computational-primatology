name: Check Links

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:
  pull_request:
    paths: ['README.md', 'lychee.toml', '.github/workflows/link-check.yml']

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Link Checker
        id: lychee
        # v2.0.2 ignored `fail: false` (failIfEmpty forced the fail flag on), so the step
        # failed anyway. Pin a release where the inputs behave, and make the intent explicit:
        # broken links fail the run, and the steps below report them.
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --verbose --no-progress README.md
          fail: true
          output: lychee/out.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or refresh the broken-links issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.existsSync('lychee/out.md')
              ? fs.readFileSync('lychee/out.md', 'utf8')
              : '_lychee produced no report — the job failed before the link check ran._';
            const body = [
              `Automated link checking found broken links in the repository (run of ${date}).`,
              '',
              `Workflow run: ${runUrl}`,
              '',
              report,
              '',
              '---',
              '*This issue is maintained automatically by the link checker workflow. It is refreshed, not duplicated, on subsequent failures.*',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
              per_page: 5,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing on ${date}.\n\n${body}`,
              });
              core.info(`Commented on existing issue #${open[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔗 Broken Links Found - ${date}`,
                body,
                labels: ['maintenance', 'broken-links'],
              });
              core.info(`Opened issue #${issue.number}`);
            }

      - name: Comment on PR if links are broken
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('lychee/out.md') ? fs.readFileSync('lychee/out.md', 'utf8') : '';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '⚠️ **Link Check Failed**',
                '',
                'Some links in your changes appear to be broken or inaccessible. Fix them before merging, or add a justified exclusion to `lychee.toml`.',
                '',
                report,
                '',
                '**How to check locally** (uses the same config as CI):',
                '```bash',
                'docker run --rm -v "$PWD:/input" -w /input lycheeverse/lychee:latest --config lychee.toml --no-progress README.md',
                '```',
                '',
                '*This comment was automatically generated by the link checker.*',
              ].join('\n'),
            });
