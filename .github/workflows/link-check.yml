name: Check Links

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:
  pull_request:
    paths: ['README.md', 'lychee.toml', '.github/workflows/link-check.yml']

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On PRs, check only the README lines the PR adds or changes, so a contributor is
      # never blocked by an unrelated link that went flaky. The weekly run checks all.
      - name: Collect links to check
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- README.md \
              | grep '^+' | grep -v '^+++' | sed 's/^+//' > lychee-input.md || true
          else
            cp README.md lychee-input.md
          fi
          if grep -q 'http' lychee-input.md; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No added or changed links to check." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Link Checker
        id: lychee
        if: steps.scope.outputs.any == 'true'
        # v2.0.2 ignored `fail: false` (failIfEmpty forced the fail flag on), so the step
        # failed anyway. Pin a release where the inputs behave, and make the intent explicit:
        # broken links fail the run, and the steps below report them.
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --verbose --no-progress lychee-input.md
          fail: true
          output: lychee/out.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or refresh the broken-links issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.existsSync('lychee/out.md')
              ? fs.readFileSync('lychee/out.md', 'utf8')
              : '_lychee produced no report — the job failed before the link check ran._';
            const body = [
              `Automated link checking found broken links in the repository (run of ${date}).`,
              '',
              `Workflow run: ${runUrl}`,
              '',
              report,
              '',
              '---',
              '*This issue is maintained automatically by the link checker workflow. It is refreshed, not duplicated, on subsequent failures.*',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
              per_page: 5,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing on ${date}.\n\n${body}`,
              });
              core.info(`Commented on existing issue #${open[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔗 Broken Links Found - ${date}`,
                body,
                labels: ['maintenance', 'broken-links'],
              });
              core.info(`Opened issue #${issue.number}`);
            }
